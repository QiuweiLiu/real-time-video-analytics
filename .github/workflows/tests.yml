name: Core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core test dependencies
        run: python -m pip install pytest==8.3.5 numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Test analytics, events, video input and RTSP handling
        run: >-
          python -m pytest -v
          tests/test_line_crossing.py
          tests/test_roi.py
          tests/test_events.py
          tests/test_video_source.py
          tests/test_rtsp.py
