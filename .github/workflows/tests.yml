name: Core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install core test and vision import dependencies
        run: >-
          python -m pip install
          opencv-python==5.0.0.93 ultralytics==8.4.121
          PyYAML==6.0.3 numpy==2.4.6 pytest==8.3.5
      - name: Test analytics, events, video input and RTSP handling
        run: >-
          python -m pytest -v
          tests/test_line_crossing.py
          tests/test_roi.py
          tests/test_events.py
          tests/test_video_source.py
          tests/test_rtsp.py
